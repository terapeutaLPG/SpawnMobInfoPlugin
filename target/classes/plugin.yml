name: BlazeKillTracker
version: 1.0
author: jaruso99
main: com.yourname.blazekilltracker.BlazeKillTracker
description: Plugin that tracks Blaze kills and alerts about Blaze/Ghast spawn eggs
api-version: 1.13

commands:
  blazekills:
    description: View Blaze kill statistics
    usage: /blazekills [player]
    permission: blazekilltracker.view
  blazekillsreload:
    description: Reload plugin configuration
    usage: /blazekillsreload
    permission: blazekilltracker.reload
  blazekill:
    description: Toggle spawn egg alerts, view spawn history, get MobLog tool, view last spawns, teleport to player's last spawn, check block changes
    usage: /blazekill <active|deactive|hist|logitem|lastspawn|tp|sprawdzbloki|help>
    permission: blazekilltracker.alerts

permissions:
  blazekilltracker.view:
    description: Allows viewing Blaze kill statistics
    default: true
  blazekilltracker.reload:
    description: Allows reloading plugin configuration
    default: op
  blazekilltracker.alerts:
    description: Allows toggling spawn egg alerts for Blaze and Ghast
    default: op
  blazekilltracker.history:
    description: Allows viewing spawn history
    default: true
  blazekilltracker.moblog:
    description: Allows using MobLog tool
    default: true
  blazekilltracker.lastspawn:
    description: Allows viewing last spawns
    default: true
  blazekilltracker.teleport:
    description: Allows teleporting to spawn locations
    default: op
  blazekilltracker.blockcheck:
    description: Allows checking block changes
    default: true
