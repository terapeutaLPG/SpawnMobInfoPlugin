name: BlazeKillTracker
version: 1.0
author: jaruso99
main: com.yourname.blazekilltracker.BlazeKillTracker
description: Plugin that tracks Blaze kills and alerts about Blaze/Ghast spawn eggs
api-version: 1.13

commands:
  blazekills:
    description: View Blaze kill statistics
    usage: /blazekills [player]
    permission: blazekilltracker.view
  blazekillsreload:
    description: Reload plugin configuration
    usage: /blazekillsreload
    permission: blazekilltracker.reload
  blazekill:
    description: Toggle spawn egg alerts, view spawn history, get MobLog tool
    usage: /blazekill <active|deactive|hist|logitem|help>
    permission: blazekilltracker.alerts

permissions:
  blazekilltracker.view:
    description: Allows viewing Blaze kill statistics
    default: true
  blazekilltracker.reload:
    description: Allows reloading plugin configuration
    default: op
  blazekilltracker.alerts:
    description: Allows toggling spawn egg alerts for Blaze and Ghast
    default: op
