# Konfiguracja pluginu BlazeKillTracker

# Czy powiadomienia o zabójstwach mają być wysyłane do gracza
notify-player-on-kill: true

# Czy zapisywać współrzędne dokładne czy zaokrąglone do bloków
use-block-coordinates: true

# Maksymalna liczba rekordów wyświetlanych w rankingu
max-top-players: 10

# Format daty i czasu (Java DateTimeFormatter)
date-format: "dd-MM-yyyy HH:mm:ss"

# Czy logować zabójstwa do konsoli serwera
log-kills-to-console: false

# NOWE! Ustawienia alertów o spawn eggs
spawn-alerts:
  # Czy powiadomienia o spawn eggs są włączone globalnie
  enabled: true

  # Czy wysyłać klikalne wiadomości do teleportacji
  clickable-teleport: true

  # Czy domyślnie włączać alerty dla nowych operatorów
  default-for-ops: true

  # Format wiadomości o spawn eggs
  message-format: "&c[SPAWN ALERT] &e{player} &fusył &b{egg} &fw &a{world} &f({x}, {y}, {z})"
